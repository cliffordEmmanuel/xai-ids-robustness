run:
  seed: 42
  output_dir: results
  results_version: smoke-v4-core
dataset:
  name: unsw_nb15
  normalise: standard
  balance: none
  attack_subset_size: 12
model:
  name: xgboost
  params:
    n_estimators: 20
explainer:
  name: lime
  shap_backend: tree
  shap_background_size: 100
  shap_kernel_nsamples: 100
  lime_num_samples: 100
threat_model:
  model_access: probability_query
  explanation_access: oracle
  query_budget:
    model_queries: 10000
    explanation_queries: 20
attack:
  strand: fragility
  method: pgd
  gradient_source: spsa
  objective: loss
  epsilon: 0.03
  steps: 2
  step_size: 0.01
  spsa:
    q: 1
    delta: 0.01
  target_rule: none
  target_objective: suppression
  enforce_prediction_preserved: false
metrics:
  stability:
  - spearman
  - topk_jaccard
  fidelity:
  - deletion
  - insertion
  drift:
  - cosine
  - l1
  - l2
  topk: 10
  measure_lime_noise_floor: true
  noise_floor_repeats: 2
  noise_floor_seeds:
  - 1009
  - 1013
