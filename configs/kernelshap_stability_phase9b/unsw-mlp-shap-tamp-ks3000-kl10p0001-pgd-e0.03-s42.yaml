run:
  seed: 42
  output_dir: results
  results_version: kernelshap-calibration-v2
dataset:
  name: unsw_nb15
  normalise: standard
  balance: none
  attack_subset_size: 24
model:
  name: mlp
  params:
    n_estimators: 20
explainer:
  name: shap
  shap_backend: kernel
  shap_background_size: 100
  shap_kernel_nsamples: 3000
  shap_kernel_l1_reg: 0.0001
  shap_kernel_stability_repeats: 3
  shap_kernel_stability_seeds:
  - 2003
  - 2011
  - 2017
  shap_kernel_additivity_tolerance: 1.0e-06
  shap_kernel_repeat_cosine_drift_tolerance: 0.05
  require_shap_kernel_stability: false
threat_model:
  model_access: probability_query
  explanation_access: oracle
  query_budget:
    model_queries: 25000
    explanation_queries: 30
attack:
  strand: tamper
  method: pgd
  gradient_source: spsa
  objective: attribution
  epsilon: 0.03
  steps: 3
  step_size: 0.01
  spsa:
    q: 1
    delta: 0.01
  target_rule: top1_suppress
  target_objective: suppression
  enforce_prediction_preserved: true
metrics:
  stability:
  - spearman
  - topk_jaccard
  fidelity:
  - deletion
  - insertion
  drift:
  - cosine
  - l1
  - l2
  topk: 10
  measure_lime_noise_floor: false
  noise_floor_repeats: 2
  noise_floor_seeds:
  - 1009
  - 1013
