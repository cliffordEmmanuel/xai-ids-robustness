# Phase 7 backend control (run first): hold SHAP's model-agnostic KernelSHAP
# implementation and its sampling parameters fixed while using XGBoost.
# These six cells can be compared with the existing MLP + KernelSHAP PGD cells
# without treating TreeSHAP-versus-KernelSHAP as an architecture effect.
output_dir: configs/shap_kernel_xgboost_fragility
base: configs/fragility_example.yaml
kernel_shap:
  shap_kernel_l1_reg: 0.0001
  shap_kernel_stability_repeats: 3
  shap_kernel_stability_seeds: [2003, 2011, 2017]
  shap_kernel_additivity_tolerance: 0.000001
  shap_kernel_repeat_cosine_drift_tolerance: 0.05
  require_shap_kernel_stability: true
axes:
  dataset: [cicids2017, unsw_nb15]
  model: [xgboost]
  explainer: [shap]
  shap_backend: [kernel]
  shap_background_size: [100]
  shap_kernel_nsamples: [100]
  strand: [fragility]
  method: [pgd]
  epsilon: [0.03]
  seed: [42, 7, 123]
