# Fragility strand (RQ1-RQ3): standard PGD, loss objective, prediction-preserving.
# Cheap, full-grid experiment measuring incidental explanation drift.
run:
  id: null
  seed: 42
  seeds: [42, 7, 123]
  output_dir: results/

dataset:
  name: cicids2017
  normalise: standard
  balance: none            # imbalance handled at model level (class weights)
  attack_subset_size: 500

model:
  name: mlp

explainer:
  name: shap
  shap_backend: kernel      # MLP -> kernel SHAP
  lime_num_samples: 1500
  cache_baseline: true

attack:
  strand: fragility
  method: pgd
  gradient_source: spsa
  objective: loss
  epsilon: 0.03
  steps: 50
  step_size: 0.005
  spsa:
    q: 2
    delta: 0.01
  target_rule: none
  enforce_prediction_preserved: true

metrics:
  stability: [spearman, topk_jaccard]
  fidelity: [local_fidelity, deletion, insertion]
  drift: [cosine, l1, l2]
  topk: 10
  subtract_lime_noise_floor: true
  fixed_cohort: true
