# Phase 7 backend-control follow-up. Run only after the fragility control has
# passed a smoke check: KernelSHAP is called inside the tamper attack loop.
# This holds the SHAP implementation fixed for an optional architecture control.
output_dir: configs/shap_kernel_xgboost_tamper
base: configs/tamper_example.yaml
kernel_shap:
  shap_kernel_l1_reg: 0.0001
  shap_kernel_stability_repeats: 3
  shap_kernel_stability_seeds: [2003, 2011, 2017]
  shap_kernel_additivity_tolerance: 0.000001
  shap_kernel_repeat_cosine_drift_tolerance: 0.05
  require_shap_kernel_stability: true
axes:
  dataset: [cicids2017, unsw_nb15]
  model: [xgboost]
  explainer: [shap]
  shap_backend: [kernel]
  shap_background_size: [100]
  shap_kernel_nsamples: [100]
  strand: [tamper]
  method: [pgd]
  epsilon: [0.03]
  seed: [42, 7, 123]
