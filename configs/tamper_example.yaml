# Tamper strand (RQ4): targeted attack, attribution objective, top-1 suppression.
# One of the 8 tamper cells (here: XGBoost + TreeSHAP on UNSW-NB15).
run:
  id: null
  seed: 42
  seeds: [42, 7, 123]
  output_dir: results/

dataset:
  name: unsw_nb15
  normalise: standard
  balance: none            # imbalance handled at model level (class weights)
  attack_subset_size: 500

model:
  name: xgboost

explainer:
  name: shap
  shap_backend: tree        # XGBoost -> TreeSHAP (fast, in-loop)
  shap_background_size: 100
  shap_kernel_nsamples: 100
  lime_num_samples: 1500
  cache_baseline: true

threat_model:
  model_access: probability_query
  explanation_access: oracle
  query_budget:
    model_queries: 125000       # individual input probability vectors per attack
    explanation_queries: 250    # logical explanation-service requests per attack

attack:
  strand: tamper
  method: pgd
  gradient_source: spsa     # SPSA on both models for the tamper strand
  objective: attribution
  epsilon: 0.03
  steps: 50
  step_size: 0.005
  spsa:
    q: 2
    delta: 0.01
  target_rule: top1_suppress
  target_objective: suppression  # primary: reduce the target's attribution magnitude
  enforce_prediction_preserved: true

metrics:
  stability: [spearman, topk_jaccard]
  fidelity: [local_fidelity, deletion, insertion]
  drift: [cosine, l1, l2]
  topk: 10
  measure_lime_noise_floor: true
  noise_floor_repeats: 10
  noise_floor_seeds: [1009, 1013, 1019, 1021, 1031, 1033, 1039, 1049, 1051, 1061]
